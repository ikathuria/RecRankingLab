[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "Two-stage movie recommender with leakage-safe evaluation and a simulated A/B test"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb==1.5.6",
    "polars==2.0.0",
    "lightgbm==4.7.0",
    "torch==2.14.1",
    "mlflow==3.17.2",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.1",
    "streamlit==1.66.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
